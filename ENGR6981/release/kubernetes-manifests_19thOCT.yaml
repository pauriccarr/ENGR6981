---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: ollama-data
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 50Gi

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ollama
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ollama
  template:
    metadata:
      labels:
        app: ollama
    spec:
      containers:
      - name: ollama
        image: ollama/ollama:latest
        command: ["/bin/sh", "-c"]
        args:
          - |
            ollama serve &
            sleep 10
            ollama pull llama3
            ollama pull llama3.2:1b
            wait
        ports:
        - containerPort: 11434
        volumeMounts:
        - name: ollama-data
          mountPath: /root/.ollama
        resources:
          requests:
            memory: "8Gi"
            cpu: "2000m"
          limits:
            memory: "16Gi"
            cpu: "4000m"
        # Optional: GPU support
        # resources:
        #   limits:
        #     nvidia.com/gpu: 1
      volumes:
      - name: ollama-data
        persistentVolumeClaim:
          claimName: ollama-data

---
apiVersion: v1
kind: Service
metadata:
  name: ollama
spec:
  selector:
    app: ollama
  ports:
  - port: 11434
    targetPort: 11434
---
# CurrencyAgent: deployed NEXT TO the real currencyservice, never in place of it.
# The real currencyservice (port 7000, gRPC) keeps serving the frontend and checkout; this agent
# calls it as a client (CURRENCY_HOST=currencyservice) and exposes an HTTP API + fault-injection UI hooks.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: currencyagent
  labels:
    app: currencyagent
spec:
  selector:
    matchLabels:
      app: currencyagent
  template:
    metadata:
      labels:
        app: currencyagent
    spec:
      serviceAccountName: currencyservice
      enableServiceLinks: false
      terminationGracePeriodSeconds: 5
      securityContext:
        fsGroup: 1000
        runAsGroup: 1000
        runAsNonRoot: true
        runAsUser: 1000
      containers:
      - name: server
        image: ghcr.io/pauriccarr/engr-currency-agent:latest
        imagePullPolicy: Always
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
              - ALL
          privileged: false
          readOnlyRootFilesystem: true
        ports:
        - name: grpc
          containerPort: 7000
        - name: http
          containerPort: 8080
        env:
        - name: AGENT_NAME
          value: "currency"
        - name: GRPC_PORT
          value: "7000"
        # The agent calls its own embedded gRPC server (default 127.0.0.1:7000). Do NOT set
        # CURRENCY_HOST=currencyservice: that Service now points back at this pod.
        - name: OLLAMA_HOST
          value: "http://ollama:11434"
        - name: LLAMA_MODEL
          value: "llama3.2:1b"
        - name: RESULTS_DIR
          value: /results
        volumeMounts:
        - name: results
          mountPath: /results
        readinessProbe:
          grpc:
            port: 7000
          initialDelaySeconds: 5
        livenessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 20
        resources:
          requests:
            cpu: 100m
            memory: 256Mi
          limits:
            cpu: 500m
            memory: 512Mi
      volumes:
      - name: results
        emptyDir: {}
---
# Same name/port the frontend, checkout and recommendation services already use.
apiVersion: v1
kind: Service
metadata:
  name: currencyservice
  labels:
    app: currencyagent
spec:
  type: ClusterIP
  selector:
    app: currencyagent
  ports:
  - name: grpc
    port: 7000
    targetPort: 7000
---
